[greeter]
background=/usr/share/backgrounds/funos/funos-default.png
theme-name=Arc-Dark
icon-theme-name=Papirus-Dark
font-name=Sans 11
xft-antialias=true
xft-dpi=96
xft-hintstyle=hintslight
xft-rgba=rgb
indicators=~host;~spacer;~clock;~spacer;~session;~power
clock-format=%H:%M
position=50%,center 50%,center
default-user-image=/usr/share/pixmaps/funos-logo.svg
