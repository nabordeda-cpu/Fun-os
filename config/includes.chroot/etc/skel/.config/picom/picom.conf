backend = "xrender";
vsync = true;
use-damage = true;
corner-radius = 14;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.35;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;
detect-client-opacity = true;
